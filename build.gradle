plugins { id 'java' }
group = 'jp.tdr'
version = '1.1.0'
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.227-stable'
    compileOnly files('dev/plugins/Towny-0.103.2.0.jar', 'dev/plugins/SiegeWar-3.7.0.jar', 'dev/plugins/VaultUnlocked-2.20.3.jar')
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform(); jvmArgs '--enable-native-access=ALL-UNNAMED' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources { filesMatching('plugin.yml') { expand(version: project.version) } }
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}

// Explicitly built development probe. Never part of the production plugin JAR.
sourceSets {
    integration {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('integrationJar', Jar) {
    dependsOn integrationClasses
    archiveBaseName = 'TDRDevelopmentProbe'
    from sourceSets.integration.output
}
